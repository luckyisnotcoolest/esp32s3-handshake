name: Build handshake v2.0

on:
  push:
    branches: [main, master]
    paths:
      - 'handshake.ino'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'handshake.ino'
  workflow_dispatch:

jobs:
  build:
    name: Compile for ESP32-S3 N16R8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. arduino-cli ────────────────────────────────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ── 3. Install ESP32 Arduino core 3.3.5 ──────────────────────────────
      - name: Install ESP32 core
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli core list

      # ── 4. Install libraries ──────────────────────────────────────────────
      - name: Install libraries
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          rm -rf "$LIBDIR/AsyncTCP" "$LIBDIR/ESPAsyncWebServer"
          git clone --depth 1 \
            https://github.com/ESP32Async/AsyncTCP.git \
            "$LIBDIR/AsyncTCP"
          git clone --depth 1 \
            https://github.com/ESP32Async/ESPAsyncWebServer.git \
            "$LIBDIR/ESPAsyncWebServer"
          arduino-cli lib install "Adafruit NeoPixel" || \
            arduino-cli lib install "Adafruit NeoPixel" --overwrite
          echo "=== Installed libraries ==="
          ls -la "$LIBDIR"

      # ── 5. Locate toolchain + libnet80211.a ──────────────────────────────
      - name: Locate toolchain paths
        run: |
          set -euo pipefail
          TOOLS="$HOME/.arduino15/packages/esp32/tools"
          PKG="$HOME/.arduino15/packages/esp32"
          set +e
          OBJCOPY=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objcopy" -type f 2>/dev/null | head -1)
          NM=$(find "$TOOLS" -name "xtensa-esp32s3-elf-nm" -type f 2>/dev/null | head -1)
          AR=$(find "$TOOLS" -name "xtensa-esp32s3-elf-ar" -type f 2>/dev/null | head -1)
          READELF=$(find "$TOOLS" -name "xtensa-esp32s3-elf-readelf" -type f 2>/dev/null | head -1)
          LIBNET=$(find "$PKG" -name "libnet80211.a" -path "*/esp32s3/*" -type f 2>/dev/null | head -1)
          [ -z "$LIBNET" ] && LIBNET=$(find "$PKG" -name "libnet80211.a" -type f 2>/dev/null | head -1)
          set -e
          echo "OBJCOPY : ${OBJCOPY:-NOT FOUND}"
          echo "NM      : ${NM:-NOT FOUND}"
          echo "AR      : ${AR:-NOT FOUND}"
          echo "READELF : ${READELF:-NOT FOUND}"
          echo "LIBNET  : ${LIBNET:-NOT FOUND}"
          [ -z "$OBJCOPY" ] && { echo "FATAL: objcopy not found"; exit 1; }
          [ -z "$LIBNET" ] && { echo "FATAL: libnet80211.a not found"; exit 1; }
          echo "OBJCOPY=$OBJCOPY" >> "$GITHUB_ENV"
          echo "NM=$NM" >> "$GITHUB_ENV"
          echo "AR=${AR:-}" >> "$GITHUB_ENV"
          echo "READELF=${READELF:-}" >> "$GITHUB_ENV"
          echo "LIBNET=$LIBNET" >> "$GITHUB_ENV"

      # ── 6. QUADRUPLE PATCH libnet80211.a (IDF 5.5 validated) ─────────────
      # M1: Symbol weaken — legacy compat, fails alone on IDF 5.5
      # M2: Hex patch .o — fallback for older instruction layouts
      # M3: Linker --wrap injection — compile-time override
      # M4: ELF ret0.bin post-patch — gold standard for IDF 5.5 (step 9)
      - name: Patch libnet80211.a + inject linker wrap
        run: |
          set -euo pipefail
          cp "$LIBNET" "${LIBNET}.bak"
          M1=0
          M2=0
          M3=0

          GATE_SYMBOLS=(
            "ieee80211_raw_frame_sanity_check"
            "ieee80211_output_check"
            "ieee80211_mgmt_tx_check"
            "ieee80211_tx_sanity_check"
            "wifi_tx_sanity_check"
          )

          # ── M1: Multi-symbol weaken ───────────────────────────────────────
          echo "=== M1: Symbol Weakening ==="
          if [ -n "$NM" ] && [ -x "$NM" ]; then
            CURRENT_LIB="$LIBNET"
            for SYM in "${GATE_SYMBOLS[@]}"; do
              set +e
              MATCH=$("$NM" "$CURRENT_LIB" 2>/dev/null \
                | grep "$SYM" \
                | grep -cE " [Tt] ")
              set -e
              if [ "${MATCH:-0}" -gt 0 ]; then
                "$OBJCOPY" \
                  --weaken-symbol="$SYM" \
                  "$CURRENT_LIB" "${CURRENT_LIB}.tmp"
                mv "${CURRENT_LIB}.tmp" "$CURRENT_LIB"
                echo "  Weakened: $SYM"
                M1=$((M1 + 1))
              else
                echo "  Not found: $SYM"
              fi
            done
            echo "M1 result: $M1 symbol(s) weakened"
          else
            echo "M1: nm not available — skipping"
          fi

          # ── M2: Hex patch ieee80211_output.o ─────────────────────────────
          echo "=== M2: Hex Pattern Patching ==="
          if [ -n "$AR" ] && [ -x "$AR" ]; then
            WORKDIR=$(mktemp -d)
            cp "$LIBNET" "$WORKDIR/libnet80211.a"
            pushd "$WORKDIR" > /dev/null
            "$AR" x libnet80211.a ieee80211_output.o 2>/dev/null || true
            if [ -f ieee80211_output.o ]; then
              COUNT=$(python3 -c '
          import pathlib
          data = pathlib.Path("ieee80211_output.o").read_bytes()
          pattern = bytes([0x36, 0x41, 0x00, 0x0D, 0xF0])
          print(data.count(pattern))
          ')
              echo "  Pattern matches: $COUNT"
              if [ "$COUNT" = "1" ]; then
                python3 -c '
          import pathlib
          p = pathlib.Path("ieee80211_output.o")
          data = bytearray(p.read_bytes())
          pattern = bytes([0x36, 0x41, 0x00, 0x0D, 0xF0])
          idx = data.index(pattern)
          data[idx] = 0x06
          p.write_bytes(data)
          print("  Patched MOVI a4,1→0 at offset 0x{:x}".format(idx))
          '
                "$AR" rcs libnet80211.a ieee80211_output.o
                cp libnet80211.a "$LIBNET"
                M2=1
                echo "M2 result: hex patch applied OK"
              elif [ "$COUNT" = "0" ]; then
                echo "M2 result: pattern not found (layout changed or already patched)"
              else
                echo "M2 result: ambiguous ($COUNT matches) — skipping"
              fi
            else
              echo "M2 result: ieee80211_output.o not found in archive"
            fi
            popd > /dev/null
            rm -rf "$WORKDIR"
          else
            echo "M2: ar not available — skipping"
          fi

          # ── M3: Inject --wrap into platform.txt ───────────────────────────
          echo "=== M3: Linker --wrap Injection ==="
          PLATFORM_TXT=$(find "$HOME/.arduino15/packages/esp32" \
            -name "platform.txt" -path "*esp32*" -type f 2>/dev/null | head -1)
          if [ -n "$PLATFORM_TXT" ] && [ -f "$PLATFORM_TXT" ]; then
            WRAP_FLAG="-Wl,--wrap=ieee80211_raw_frame_sanity_check"
            if ! grep -qF "$WRAP_FLAG" "$PLATFORM_TXT"; then
              sed -i "s|compiler.c.elf.extra_flags=|compiler.c.elf.extra_flags=$WRAP_FLAG |" \
                "$PLATFORM_TXT"
              M3=1
              echo "M3 result: --wrap flag injected into platform.txt"
            else
              M3=1
              echo "M3 result: --wrap flag already present"
            fi
          else
            echo "M3 result: platform.txt not found — manual --wrap may be needed"
          fi

          # ── M4 prep: generate ret0.bin for ELF post-patch ─────────────────
          echo "=== M4 Prep: Generate ret0.bin ==="
          printf '\x02\x20\x00\x0D\xF0' > /tmp/ret0.bin
          echo "  ret0.bin generated ($(stat -c%s /tmp/ret0.bin) bytes)"
          echo "  Will be applied to ELF in post-compile step"

          echo "=== Pre-compile summary: M1=$M1 M2=$M2 M3=$M3 ==="

      # ── 7. Prepare sketch folder ──────────────────────────────────────────
      - name: Prepare sketch folder
        run: |
          set -euo pipefail
          rm -rf handshake
          mkdir -p handshake
          cp handshake.ino handshake/
          ls -lh handshake/

      # ── 8. Compile ────────────────────────────────────────────────────────
      - name: Compile ESP32-S3 N16R8
        run: |
          set -euo pipefail
          FQBN="esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,CDCOnBoot=default,CPUFreq=240,PSRAM=opi,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600"
          echo "FQBN: $FQBN"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --verbose \
            handshake
          echo "=== Build outputs ==="
          ls -lh build/

      # ── 9. M4: ELF-level ret0.bin post-patch (IDF 5.5 gold standard) ─────
      - name: ELF ret0.bin post-patch
        run: |
          set -euo pipefail
          ELF_FILE=$(find build/ -name "*.elf" -type f 2>/dev/null | head -1)
          if [ -z "$ELF_FILE" ]; then
            echo "WARNING: No ELF found — skipping M4"
            exit 0
          fi
          echo "Target ELF: $ELF_FILE"

          SANITY_VIRT=$(readelf -s "$ELF_FILE" 2>/dev/null \
            | grep "ieee80211_raw_frame_sanity_check" \
            | awk '{print "0x"$2}' | head -1)

          if [ -z "$SANITY_VIRT" ] || [ "$SANITY_VIRT" = "0x" ]; then
            echo "WARNING: Symbol not in ELF — M1+M3 should still provide bypass"
            exit 0
          fi
          echo "Symbol virt: $SANITY_VIRT"

          FLASH_BASE=$(readelf -S "$ELF_FILE" 2>/dev/null \
            | grep -E "\.(flash\.)?text" \
            | awk '{print "0x"$4 " + 0x"$5}' | head -1)

          if [ -z "$FLASH_BASE" ]; then
            echo "WARNING: Text section not found — skipping M4"
            exit 0
          fi
          echo "Text base: $FLASH_BASE"

          OFFSET=$(python3 -c "print($SANITY_VIRT - ($FLASH_BASE))")
          PATCH_SIZE=$(stat -c%s /tmp/ret0.bin)

          cp "$ELF_FILE" "${ELF_FILE}.unpatched"
          dd conv=notrunc if=/tmp/ret0.bin of="$ELF_FILE" \
            bs=1 count="$PATCH_SIZE" seek="$OFFSET" 2>/dev/null

          VERIFY=$(xxd -s "$OFFSET" -l "$PATCH_SIZE" "$ELF_FILE" \
            | awk '{print $2$3}')
          if [ "$VERIFY" = "0220000df0" ]; then
            echo "M4 result: ELF patch VERIFIED at offset $OFFSET"
          else
            echo "M4 result: verification mismatch (got $VERIFY)"
          fi

      # ── 10. Upload artifacts ──────────────────────────────────────────────
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: handshake-v2.0-${{ github.sha }}
          path: build/
          retention-days: 30

      # ── 11. Flash instructions ────────────────────────────────────────────
      - name: Flash instructions
        run: |
          cat << 'FLASHEOF'
          ════════════════════════════════════════════════════════
           HandshakeSniffer v2.0 — Flash Instructions
          ════════════════════════════════════════════════════════
          Recommended (single merged image):
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 \
              --baud 921600 write_flash \
              --flash_mode qio --flash_freq 80m --flash_size 16MB \
              0x0 handshake.ino.merged.bin
          Manual (three parts):
            0x0000  handshake.ino.bootloader.bin
            0x8000  handshake.ino.partitions.bin
            0x10000 handshake.ino.bin
          AP SSID : HandshakeSniffer
          AP Pass : sniff1234
          Web UI  : http://192.168.4.1/
          Heap    : http://192.168.4.1/heap
          Status  : http://192.168.4.1/status
          Clients : http://192.168.4.1/clients
          Spark   : http://192.168.4.1/spark
          NEW in v2.0:
            - Per-client session table (up to 16 concurrent)
            - Beacon PMKID extraction (no deauth needed on cached APs)
            - Unicast + broadcast deauth combo
            - Configurable reason code (1/3/7/8/15)
            - Configurable inter-frame gap (50/100/200µs)
            - Continuous deauth mode with interval control
            - Live capture sparkline graph
            - Connected clients panel with per-client deauth
            - Dark/light mode toggle (persists across sessions)
            - Keyboard shortcuts: S=scan D=deauth Esc=stop
            - All sessions exported in single 22000 file
            - RSSI in radiotap headers (Wireshark signal display)
          ════════════════════════════════════════════════════════
          FLASHEOF
