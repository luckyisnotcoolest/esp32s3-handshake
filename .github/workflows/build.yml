# ══════════════════════════════════════════════════════════════════════════════
#  HandshakeSniffer — GitHub Actions build
#  Target : ESP32-S3 N16R8 (OPI PSRAM, 16MB flash)
#  Toolchain : arduino-cli + arduino-esp32 3.3.5 (IDF 5.3.x)
#
#  PATCHES APPLIED:
#
#  1. libnet80211.a — weaken ieee80211_raw_frame_sanity_check
#     The sketch redefines this symbol to bypass the TX sanity check
#     (required for esp_wifi_80211_tx raw frame injection / deauth).
#     IDF 5.x ships a strong definition in libnet80211.a; the linker
#     rejects a second strong definition in the sketch. We run objcopy
#     --weaken-symbol on the archive so the sketch's definition wins
#     at link time without --allow-multiple-definition.
#
#  2. board flags — OPI PSRAM + 16MB flash + Huge APP partition
#     Set via FQBN options passed directly to arduino-cli compile.
#
#  3. Libraries installed via git clone (HEAD, no pinned tag — avoids
#     HTTPS credential prompting on newer CI runners):
#       - ESP32Async/AsyncTCP
#       - ESP32Async/ESPAsyncWebServer
#       - Adafruit NeoPixel (via arduino-cli lib install)
#     DNSServer is built into arduino-esp32 — no extra lib needed.
#
#  ARTIFACTS:
#     build/  — .bin, .elf, .map (upload to device with esptool)
# ══════════════════════════════════════════════════════════════════════════════

name: Build HandshakeSniffer

on:
  push:
    branches: [ main, master ]
    paths:
      - 'HandshakeSniffer.ino'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'HandshakeSniffer.ino'
  workflow_dispatch:

jobs:
  build:
    name: Compile for ESP32-S3 N16R8
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. arduino-cli ────────────────────────────────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ── 3. Install ESP32 Arduino core 3.3.5 ──────────────────────────────
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core list

      # ── 4. Install 3rd-party libraries ───────────────────────────────────
      # git clone --depth 1 (no --branch) clones HEAD of the default branch.
      # This avoids the HTTPS credential prompt that breaks pinned-tag clones
      # on newer CI runners. DNSServer ships with arduino-esp32, no install needed.
      - name: Install libraries
        run: |
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git        "$LIBDIR/AsyncTCP"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git "$LIBDIR/ESPAsyncWebServer"
          arduino-cli lib install "Adafruit NeoPixel"
          echo "=== Installed libraries ===" && ls "$LIBDIR"

      # ── 5. Locate toolchain + libnet80211.a ──────────────────────────────
      - name: Locate toolchain paths
        run: |
          TOOLS="$HOME/.arduino15/packages/esp32/tools"
          PKG="$HOME/.arduino15/packages/esp32"

          OBJCOPY=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objcopy" -type f | head -1)
          NM=$(find      "$TOOLS" -name "xtensa-esp32s3-elf-nm"      -type f | head -1)
          LIBNET=$(find  "$PKG"   -name "libnet80211.a" -path "*/esp32s3/*" -type f | head -1)
          # Fallback for layouts that don't separate by variant
          [ -z "$LIBNET" ] && LIBNET=$(find "$PKG" -name "libnet80211.a" -type f | head -1)

          echo "OBJCOPY : ${OBJCOPY:-NOT FOUND}"
          echo "NM      : ${NM:-NOT FOUND}"
          echo "LIBNET  : ${LIBNET:-NOT FOUND}"

          [ -z "$OBJCOPY" ] && echo "FATAL: objcopy not found" && exit 1
          [ -z "$LIBNET"  ] && echo "FATAL: libnet80211.a not found" && exit 1

          echo "OBJCOPY=$OBJCOPY" >> $GITHUB_ENV
          echo "NM=$NM"           >> $GITHUB_ENV
          echo "LIBNET=$LIBNET"   >> $GITHUB_ENV

      # ── 6. Patch libnet80211.a ────────────────────────────────────────────
      # Weaken ieee80211_raw_frame_sanity_check so the sketch's stub wins at
      # link time and raw frame TX (deauth/disassoc) reaches the radio.
      - name: Patch libnet80211.a — weaken sanity check symbol
        run: |
          echo "Before patch:"
          [ -n "$NM" ] && "$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" \
            || echo "(symbol may be in a member object)"

          "$OBJCOPY" --weaken-symbol=ieee80211_raw_frame_sanity_check \
            "$LIBNET" "$LIBNET.patched"
          mv "$LIBNET.patched" "$LIBNET"

          echo "After patch:"
          [ -n "$NM" ] && "$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" \
            || echo "(patch applied to member objects — top-level nm may not show it)"
          echo "Patch OK"

      # ── 7. Prepare sketch folder ──────────────────────────────────────────
      # arduino-cli requires a directory named after the .ino file.
      - name: Prepare sketch folder
        run: |
          mkdir -p HandshakeSniffer
          cp HandshakeSniffer.ino HandshakeSniffer/
          echo "=== Sketch folder ===" && ls -lh HandshakeSniffer/

      # ── 8. Compile ────────────────────────────────────────────────────────
      - name: Compile ESP32-S3
        run: |
          FQBN="esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,CDCOnBoot=default,CPUFreq=240,PSRAM=opi,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600"
          echo "FQBN: $FQBN"

          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --verbose \
            HandshakeSniffer

          echo "=== Build outputs ===" && ls -lh build/

      # ── 9. Upload artifacts ───────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: handshake-sniffer-${{ github.sha }}
          path: build/
          retention-days: 30

      # ── 10. Flash instructions ────────────────────────────────────────────
      - name: Flash instructions
        run: |
          echo "════════════════════════════════════════════"
          echo " Flash command (from repo root after download):"
          echo ""
          echo "   pip install esptool"
          echo "   esptool.py --chip esp32s3 --port /dev/ttyUSB0 \\"
          echo "     --baud 921600 write_flash 0x0 handshake_sniffer.bin"
          echo "════════════════════════════════════════════"
