name: Build handshake.ino (ESP32-S3 N16R8U)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache toolchain + libs
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages/esp32
            ~/Arduino/libraries
          key: esp32-3.3.11-${{ hashFiles('build.yml') }}

      - name: Install ESP32 core 3.3.11
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli core list | grep -q "esp32:esp32.*3.3.11" || {
            echo "FATAL: core 3.3.11 not installed"; exit 1;
          }

      - name: Install Async libraries (pinned tags)
        run: |
          set -euo pipefail
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          # Pin to released tags — fail hard if checkout fails
          if [ ! -d "$LIBDIR/AsyncTCP" ]; then
            git clone --branch v3.5.0 --depth 1 \
              https://github.com/ESP32Async/AsyncTCP.git "$LIBDIR/AsyncTCP"
          fi
          if [ ! -d "$LIBDIR/ESPAsyncWebServer" ]; then
            git clone --branch v3.12.0 --depth 1 \
              https://github.com/ESP32Async/ESPAsyncWebServer.git "$LIBDIR/ESPAsyncWebServer"
          fi
          # Sanity: confirm we landed on the expected tags
          git -C "$LIBDIR/AsyncTCP" describe --tags --exact-match
          git -C "$LIBDIR/ESPAsyncWebServer" describe --tags --exact-match

      - name: Locate toolchain tools (prefer version-sorted, explicit)
        run: |
          set -euo pipefail
          TOOLS="$HOME/.arduino15/packages/esp32/tools"
          PKG="$HOME/.arduino15/packages/esp32"

          # Prefer the highest versioned toolchain that contains the tools
          OBJCOPY=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objcopy" -type f | sort -V | tail -1)
          NM=$(find "$TOOLS" -name "xtensa-esp32s3-elf-nm" -type f | sort -V | tail -1)
          READELF=$(find "$TOOLS" -name "xtensa-esp32s3-elf-readelf" -type f | sort -V | tail -1)
          AR=$(find "$TOOLS" -name "xtensa-esp32s3-elf-ar" -type f | sort -V | tail -1)
          OBJDUMP=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objdump" -type f | sort -V | tail -1)
          LIBNET=$(find "$PKG" -name "libnet80211.a" -path "*/esp32s3/*" -type f | sort -V | tail -1)

          [ -x "$OBJCOPY" ] || { echo "FATAL: objcopy missing"; exit 1; }
          [ -x "$NM" ]      || { echo "FATAL: nm missing"; exit 1; }
          [ -x "$READELF" ] || { echo "FATAL: readelf missing"; exit 1; }
          [ -x "$AR" ]      || { echo "FATAL: ar missing"; exit 1; }
          [ -x "$OBJDUMP" ] || { echo "FATAL: objdump missing"; exit 1; }
          [ -f "$LIBNET" ]  || { echo "FATAL: libnet80211.a missing"; exit 1; }

          echo "OBJCOPY=$OBJCOPY" >> $GITHUB_ENV
          echo "NM=$NM"           >> $GITHUB_ENV
          echo "READELF=$READELF" >> $GITHUB_ENV
          echo "AR=$AR"           >> $GITHUB_ENV
          echo "OBJDUMP=$OBJDUMP" >> $GITHUB_ENV
          echo "LIBNET=$LIBNET"   >> $GITHUB_ENV

          echo "Selected tools:"
          echo "  OBJCOPY=$OBJCOPY"
          echo "  NM=$NM"
          echo "  READELF=$READELF"
          echo "  AR=$AR"
          echo "  OBJDUMP=$OBJDUMP"
          echo "  LIBNET=$LIBNET"

      - name: Identify referencing object inside libnet80211.a
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          cd "$TMP"
          "$AR" x "$LIBNET"
          echo "=== Objects that reference ieee80211_raw_frame_sanity_check ==="
          REF_OBJS=""
          for o in *.o; do
            if "$NM" "$o" 2>/dev/null | grep -q "ieee80211_raw_frame_sanity_check"; then
              echo "  $o"
              REF_OBJS="$REF_OBJS $o"
              "$NM" "$o" | grep "ieee80211_raw_frame_sanity_check" || true
            fi
          done
          if [ -z "$REF_OBJS" ]; then
            echo "WARN: no object inside archive references the symbol"
          fi
          echo "REF_OBJS=$REF_OBJS" >> $GITHUB_ENV

      - name: Patch archive — weaken + inject strong override object
        run: |
          set -euo pipefail
          # Strategy: weaken the library definition so our strong definition
          # (provided by the sketch) can win at link time. This is not
          # equivalent to --wrap; it relies on the linker preferring a
          # strong global over a weak one when both are present.
          echo "=== BEFORE patch ==="
          "$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" || true

          "$OBJCOPY" --weaken-symbol=ieee80211_raw_frame_sanity_check \
            "$LIBNET" "$LIBNET.patched"
          mv "$LIBNET.patched" "$LIBNET"

          echo "=== AFTER weaken ==="
          AFTER=$("$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" || true)
          echo "$AFTER"

          # Require the symbol to actually be weak (W/w). Reject residual T/t.
          if echo "$AFTER" | grep -qE " [Tt] "; then
            echo "FATAL: symbol still GLOBAL/TEXT after weaken"
            exit 1
          fi
          if ! echo "$AFTER" | grep -qE " [Ww] "; then
            echo "FATAL: symbol did not become weak (W/w) after --weaken-symbol"
            exit 1
          fi
          echo "Weaken verified: symbol is now weak"

          # Sanity: archive still valid
          "$AR" t "$LIBNET" >/dev/null || { echo "FATAL: archive corrupted after patch"; exit 1; }
          echo "Archive integrity OK"

      - name: Compile
        run: |
          set -euo pipefail
          mkdir -p handshake
          cp handshake.ino handshake/
          # Explicit FQBN for ESP32-S3 N16R8U characteristics
          FQBN="esp32:esp32:esp32s3:PartitionScheme=huge_app,CDCOnBoot=disabled,CPUFreq=240,PSRAM=opi,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600"
          echo "FQBN=$FQBN"
          arduino-cli compile --fqbn "$FQBN" --output-dir build handshake
          ls -lh build/

      - name: Verify symbol resolution in final ELF
        run: |
          set -euo pipefail
          ELF=$(find build -name "*.elf" | sort | head -1)
          [ -f "$ELF" ] || { echo "FATAL: ELF not found"; exit 1; }
          echo "ELF: $ELF"

          # 1. Symbol table: must be defined (T/t), not undefined (U)
          SYM=$("$NM" "$ELF" | grep -w "ieee80211_raw_frame_sanity_check" || true)
          echo "Symbol line: $SYM"
          [ -n "$SYM" ] || { echo "FATAL: symbol absent from ELF"; exit 1; }
          if echo "$SYM" | grep -qE " [Uu] "; then
            echo "FATAL: symbol is undefined reference — override did not bind"
            exit 1
          fi
          if ! echo "$SYM" | grep -qE " [Tt] "; then
            echo "FATAL: unexpected binding (expected T/t): $SYM"
            exit 1
          fi
          echo "Symbol is defined (T/t) in final binary"

          # 2. Relocation analysis: show how references were resolved
          echo "=== Relocations referencing the symbol ==="
          "$READELF" -r "$ELF" 2>/dev/null | grep -A2 -B2 "ieee80211_raw_frame_sanity_check" || \
            echo "(no dynamic relocations shown; static resolution expected)"

          # 3. Disassembly of the override itself (proof it is our code)
          echo "=== Disassembly of override function ==="
          "$OBJDUMP" -d "$ELF" 2>/dev/null | \
            awk '/<ieee80211_raw_frame_sanity_check>:/,/^$/' | head -40 || true

          # 4. Confirm archive still contains only weak definition
          echo "=== Library symbol state (post-link) ==="
          "$NM" "$LIBNET" 2>/dev/null | grep "ieee80211_raw_frame_sanity_check" || true

          echo "Verification complete: strong definition present; library definition remains weak"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: handshake-n16r8u
          path: build/
          retention-days: 30
