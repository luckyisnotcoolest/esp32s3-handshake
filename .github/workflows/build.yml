name: Build handshake v1.3

on:
  push:
    branches: [main, master]
    paths:
      - 'handshake.ino'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'handshake.ino'
  workflow_dispatch:

jobs:
  build:
    name: Compile for ESP32-S3 N16R8
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. arduino-cli ────────────────────────────────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ── 3. Install ESP32 Arduino core 3.3.5 ──────────────────────────────
      - name: Install ESP32 core
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli core list

      # ── 4. Install libraries ──────────────────────────────────────────────
      # ESP32Async/AsyncDNSServer does NOT exist — removed.
      # Sketch uses built-in DNSServer from ESP32 core instead.
      # GIT_TERMINAL_PROMPT=0 prevents git hanging on 404 in CI (no TTY).
      - name: Install libraries
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"

          rm -rf "$LIBDIR/AsyncTCP" "$LIBDIR/ESPAsyncWebServer"

          git clone --depth 1 \
            https://github.com/ESP32Async/AsyncTCP.git \
            "$LIBDIR/AsyncTCP"

          git clone --depth 1 \
            https://github.com/ESP32Async/ESPAsyncWebServer.git \
            "$LIBDIR/ESPAsyncWebServer"

          arduino-cli lib install "Adafruit NeoPixel" || \
            arduino-cli lib install "Adafruit NeoPixel" --overwrite

          echo "=== Installed libraries ==="
          ls -la "$LIBDIR"

      # ── 5. Locate toolchain + libnet80211.a ──────────────────────────────
      - name: Locate toolchain paths
        run: |
          set -euo pipefail
          TOOLS="$HOME/.arduino15/packages/esp32/tools"
          PKG="$HOME/.arduino15/packages/esp32"

          set +e
          OBJCOPY=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objcopy" -type f 2>/dev/null | head -1)
          NM=$(find      "$TOOLS" -name "xtensa-esp32s3-elf-nm"      -type f 2>/dev/null | head -1)
          LIBNET=$(find  "$PKG"   -name "libnet80211.a" -path "*/esp32s3/*" -type f 2>/dev/null | head -1)
          [ -z "$LIBNET" ] && LIBNET=$(find "$PKG" -name "libnet80211.a" -type f 2>/dev/null | head -1)
          set -e

          echo "OBJCOPY : ${OBJCOPY:-NOT FOUND}"
          echo "NM      : ${NM:-NOT FOUND}"
          echo "LIBNET  : ${LIBNET:-NOT FOUND}"

          [ -z "$OBJCOPY" ] && { echo "FATAL: objcopy not found"; exit 1; }
          [ -z "$LIBNET"  ] && { echo "FATAL: libnet80211.a not found"; exit 1; }

          echo "OBJCOPY=$OBJCOPY" >> "$GITHUB_ENV"
          echo "NM=$NM"           >> "$GITHUB_ENV"
          echo "LIBNET=$LIBNET"   >> "$GITHUB_ENV"

      # ── 6. Patch libnet80211.a ────────────────────────────────────────────
      - name: Patch libnet80211.a
        run: |
          set -euo pipefail
          SANITY_GLOBAL=0

          if [ -n "$NM" ] && [ -x "$NM" ]; then
            set +e
            MATCH=$("$NM" "$LIBNET" 2>/dev/null \
              | grep "ieee80211_raw_frame_sanity_check" \
              | grep -cE " [Tt] ")
            set -e
            [ "${MATCH:-0}" -gt 0 ] && SANITY_GLOBAL=1
          else
            SANITY_GLOBAL=1
          fi

          if [ "$SANITY_GLOBAL" = "1" ]; then
            cp "$LIBNET" "${LIBNET}.bak"
            "$OBJCOPY" \
              --weaken-symbol=ieee80211_raw_frame_sanity_check \
              "$LIBNET" "$LIBNET.patched"
            mv "$LIBNET.patched" "$LIBNET"
            echo "Patched OK"
          else
            echo "Symbol already weak — no patch needed"
          fi

      # ── 7. Prepare sketch folder ──────────────────────────────────────────
      - name: Prepare sketch folder
        run: |
          set -euo pipefail
          rm -rf handshake
          mkdir -p handshake
          cp handshake.ino handshake/
          ls -lh handshake/

      # ── 8. Compile ────────────────────────────────────────────────────────
      - name: Compile ESP32-S3 N16R8
        run: |
          set -euo pipefail
          FQBN="esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,CDCOnBoot=default,CPUFreq=240,PSRAM=opi,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600"

          echo "FQBN: $FQBN"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --verbose \
            handshake

          echo "=== Build outputs ==="
          ls -lh build/

      # ── 9. Upload artifacts ───────────────────────────────────────────────
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: handshake-v1.3-${{ github.sha }}
          path: build/
          retention-days: 30

      # ── 10. Flash instructions ────────────────────────────────────────────
      - name: Flash instructions
        run: |
          cat << 'FLASHEOF'
          ════════════════════════════════════════════════════════
           handshake v1.3 — Flash Instructions
          ════════════════════════════════════════════════════════

          Recommended (single merged image):
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 \
              --baud 921600 write_flash \
              --flash_mode qio --flash_freq 80m --flash_size 16MB \
              0x0 handshake.ino.merged.bin

          Manual (three parts):
            0x0000  handshake.ino.bootloader.bin
            0x8000  handshake.ino.partitions.bin
            0x10000 handshake.ino.bin

          AP SSID : HandshakeSniffer
          AP Pass : sniff1234
          Web UI  : http://192.168.4.1/
          ════════════════════════════════════════════════════════
          FLASHEOF
