name: Build handshake v2.0

on:
  push:
    branches: [main, master]
    paths:
      - 'handshake.ino'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'handshake.ino'
  workflow_dispatch:

jobs:
  build:
    name: Compile for ESP32-S3 N16R8
    runs-on: ubuntu-24.04

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. arduino-cli ────────────────────────────────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      # ── 3. Install ESP32 Arduino core 3.3.5 ──────────────────────────────
      - name: Install ESP32 core
        run: |
          set -euo pipefail
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli core list

      # ── 4. Install libraries ──────────────────────────────────────────────
      # Built-in DNSServer from ESP32 core — no external DNSServer lib needed.
      # GIT_TERMINAL_PROMPT=0 prevents git hanging on 404 in CI (no TTY).
      - name: Install libraries
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"

          rm -rf "$LIBDIR/AsyncTCP" "$LIBDIR/ESPAsyncWebServer"

          git clone --depth 1 \
            https://github.com/ESP32Async/AsyncTCP.git \
            "$LIBDIR/AsyncTCP"

          git clone --depth 1 \
            https://github.com/ESP32Async/ESPAsyncWebServer.git \
            "$LIBDIR/ESPAsyncWebServer"

          arduino-cli lib install "Adafruit NeoPixel" || \
            arduino-cli lib install "Adafruit NeoPixel" --overwrite

          echo "=== Installed libraries ==="
          ls -la "$LIBDIR"

      # ── 5. Locate toolchain + libnet80211.a ──────────────────────────────
      - name: Locate toolchain paths
        run: |
          set -euo pipefail
          TOOLS="$HOME/.arduino15/packages/esp32/tools"
          PKG="$HOME/.arduino15/packages/esp32"

          set +e
          OBJCOPY=$(find "$TOOLS" -name "xtensa-esp32s3-elf-objcopy" -type f 2>/dev/null | head -1)
          NM=$(find      "$TOOLS" -name "xtensa-esp32s3-elf-nm"      -type f 2>/dev/null | head -1)
          AR=$(find      "$TOOLS" -name "xtensa-esp32s3-elf-ar"      -type f 2>/dev/null | head -1)
          LIBNET=$(find  "$PKG"   -name "libnet80211.a" -path "*/esp32s3/*" -type f 2>/dev/null | head -1)
          [ -z "$LIBNET" ] && LIBNET=$(find "$PKG" -name "libnet80211.a" -type f 2>/dev/null | head -1)
          set -e

          echo "OBJCOPY : ${OBJCOPY:-NOT FOUND}"
          echo "NM      : ${NM:-NOT FOUND}"
          echo "AR      : ${AR:-NOT FOUND}"
          echo "LIBNET  : ${LIBNET:-NOT FOUND}"

          [ -z "$OBJCOPY" ] && { echo "FATAL: objcopy not found"; exit 1; }
          [ -z "$LIBNET"  ] && { echo "FATAL: libnet80211.a not found"; exit 1; }

          echo "OBJCOPY=$OBJCOPY" >> "$GITHUB_ENV"
          echo "NM=$NM"           >> "$GITHUB_ENV"
          echo "AR=${AR:-}"       >> "$GITHUB_ENV"
          echo "LIBNET=$LIBNET"   >> "$GITHUB_ENV"

      # ── 6. Patch libnet80211.a ────────────────────────────────────────────
      # Three-stage approach (unchanged from v1.4 — same IDF target):
      #
      # Stage A — symbol weakening (preferred):
      #   Uses xtensa-esp32s3-elf-objcopy --weaken-symbol to mark
      #   ieee80211_raw_frame_sanity_check as a weak symbol so the
      #   linker prefers our C-level override in handshake.ino.
      #   Works on IDF versions where the symbol name is unchanged.
      #
      # Stage B — hex fallback:
      #   If the symbol is absent (renamed or inlined in a newer IDF),
      #   we look for the known Xtensa instruction sequence that
      #   implements the sanity check return path and NOP it out.
      #
      #   The byte pattern targets the MOVI + RET sequence:
      #     36 41 00  = MOVI a4, 1   (load literal 1 into a4)
      #     0D F0     = RET.N        (narrow return)
      #   Patched to:
      #     02 41 00  = MOVI a4, 0   (return 0 = success, no filter)
      #     0D F0     = RET.N
      #
      #   Only fires if pattern appears exactly once; skips if 0 or >1.
      #
      # Stage C — no-op (safe fallback):
      #   If neither stage finds a target the library ships unpatched.
      #   The extern "C" override in handshake.ino may still work on
      #   some IDF versions without symbol weakening.
      - name: Patch libnet80211.a
        run: |
          set -euo pipefail

          cp "$LIBNET" "${LIBNET}.bak"

          PATCHED=0

          # ── Stage A: symbol-weaken ────────────────────────────────────────
          SANITY_GLOBAL=0
          if [ -n "$NM" ] && [ -x "$NM" ]; then
            set +e
            MATCH=$("$NM" "$LIBNET" 2>/dev/null \
              | grep "ieee80211_raw_frame_sanity_check" \
              | grep -cE " [Tt] ")
            set -e
            [ "${MATCH:-0}" -gt 0 ] && SANITY_GLOBAL=1
          else
            SANITY_GLOBAL=1
          fi

          if [ "$SANITY_GLOBAL" = "1" ]; then
            "$OBJCOPY" \
              --weaken-symbol=ieee80211_raw_frame_sanity_check \
              "$LIBNET" "$LIBNET.patched"
            mv "$LIBNET.patched" "$LIBNET"
            echo "Stage A: symbol weakened OK"
            PATCHED=1
          else
            echo "Stage A: symbol not found in archive — trying Stage B"
          fi

          # ── Stage B: hex fallback ─────────────────────────────────────────
          if [ "$PATCHED" = "0" ] && [ -n "$AR" ] && [ -x "$AR" ]; then
            WORKDIR=$(mktemp -d)
            cp "$LIBNET" "$WORKDIR/libnet80211.a"
            pushd "$WORKDIR" > /dev/null

            "$AR" x libnet80211.a ieee80211_output.o 2>/dev/null || {
              echo "Stage B: ieee80211_output.o not found in archive — skipping"
              popd > /dev/null
              rm -rf "$WORKDIR"
            }

            if [ -f ieee80211_output.o ]; then
              cat > count_pattern.py << 'EOF'
import pathlib
data = pathlib.Path("ieee80211_output.o").read_bytes()
pattern = bytes([0x36, 0x41, 0x00, 0x0D, 0xF0])
print(data.count(pattern))
EOF
              COUNT=$(python3 count_pattern.py)
              echo "Stage B: pattern matches = $COUNT"

              if [ "$COUNT" = "1" ]; then
                cat > patch_pattern.py << 'EOF'
import pathlib
p = pathlib.Path("ieee80211_output.o")
data = bytearray(p.read_bytes())
pattern = bytes([0x36, 0x41, 0x00, 0x0D, 0xF0])
idx = data.index(pattern)
data[idx] = 0x06
p.write_bytes(data)
print("Patched at offset 0x{:x}".format(idx))
EOF
                python3 patch_pattern.py
                "$AR" rcs libnet80211.a ieee80211_output.o
                cp libnet80211.a "$LIBNET"
                echo "Stage B: hex patch applied and repacked OK"
                PATCHED=1
              elif [ "$COUNT" = "0" ]; then
                echo "Stage B: pattern not found — library may already be patched or layout changed"
              else
                echo "Stage B: pattern ambiguous ($COUNT matches) — skipping to avoid corruption"
              fi
            fi

            popd > /dev/null
            rm -rf "$WORKDIR"
          fi

          # ── Stage C: no-op report ─────────────────────────────────────────
          if [ "$PATCHED" = "0" ]; then
            echo "Stage C: no patch applied — extern C override in sketch may still work"
            echo "         If deauth fails, check IDF version or file an issue."
          fi

          echo "Patch step done (PATCHED=$PATCHED)"

      # ── 7. Prepare sketch folder ──────────────────────────────────────────
      - name: Prepare sketch folder
        run: |
          set -euo pipefail
          rm -rf handshake
          mkdir -p handshake
          cp handshake.ino handshake/
          ls -lh handshake/

      # ── 8. Compile ────────────────────────────────────────────────────────
      - name: Compile ESP32-S3 N16R8
        run: |
          set -euo pipefail
          FQBN="esp32:esp32:esp32s3:EraseFlash=none,PartitionScheme=huge_app,CDCOnBoot=default,CPUFreq=240,PSRAM=opi,USBMode=hwcdc,FlashMode=qio,FlashSize=16M,DebugLevel=none,UploadSpeed=921600"

          echo "FQBN: $FQBN"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --verbose \
            handshake

          echo "=== Build outputs ==="
          ls -lh build/

      # ── 9. Upload artifacts ───────────────────────────────────────────────
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: handshake-v2.0-${{ github.sha }}
          path: build/
          retention-days: 30

      # ── 10. Flash instructions ────────────────────────────────────────────
      - name: Flash instructions
        run: |
          cat << 'FLASHEOF'
          ════════════════════════════════════════════════════════
           HandshakeSniffer v2.0 — Flash Instructions
          ════════════════════════════════════════════════════════

          Recommended (single merged image):
            esptool.py --chip esp32s3 --port /dev/ttyUSB0 \
              --baud 921600 write_flash \
              --flash_mode qio --flash_freq 80m --flash_size 16MB \
              0x0 handshake.ino.merged.bin

          Manual (three parts):
            0x0000  handshake.ino.bootloader.bin
            0x8000  handshake.ino.partitions.bin
            0x10000 handshake.ino.bin

          AP SSID : HandshakeSniffer
          AP Pass : sniff1234
          Web UI  : http://192.168.4.1/
          Heap    : http://192.168.4.1/heap
          Status  : http://192.168.4.1/status
          Clients : http://192.168.4.1/clients
          Spark   : http://192.168.4.1/spark

          NEW in v2.0:
            - Per-client session table (up to 16 concurrent)
            - Beacon PMKID extraction (no deauth needed on cached APs)
            - Unicast + broadcast deauth combo
            - Configurable reason code (1/3/7/8/15)
            - Configurable inter-frame gap (50/100/200µs)
            - Continuous deauth mode with interval control
            - Live capture sparkline graph
            - Connected clients panel with per-client deauth
            - Dark/light mode toggle (persists across sessions)
            - Keyboard shortcuts: S=scan D=deauth Esc=stop
            - All sessions exported in single 22000 file
            - RSSI in radiotap headers (Wireshark signal display)
          ════════════════════════════════════════════════════════
          FLASHEOF
