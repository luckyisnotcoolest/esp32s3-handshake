name: Build HandshakeSniffer v1.3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Arduino Core 3.3.5
        run: |
          arduino-cli config init
          arduino-cli core update-index \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.5 \
            --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Install Required Libraries
        run: |
          LIBDIR="$HOME/Arduino/libraries"
          mkdir -p "$LIBDIR"
          
          # ESP32Async forks (MANDATORY for core 3.x compatibility)
          git clone --depth 1 https://github.com/ESP32Async/AsyncTCP.git "$LIBDIR/AsyncTCP"
          git clone --depth 1 https://github.com/ESP32Async/ESPAsyncWebServer.git "$LIBDIR/ESPAsyncWebServer"
          git clone --depth 1 https://github.com/ESP32Async/AsyncDNSServer.git "$LIBDIR/AsyncDNSServer"
          
          # Adafruit NeoPixel (for LED status indicators)
          arduino-cli lib install "Adafruit NeoPixel"
          
          echo "=== Installed Libraries ==="
          ls -la "$LIBDIR"

      - name: Prepare Sketch Folder
        run: |
          mkdir -p HandshakeSniffer
          cp HandshakeSniffer.ino HandshakeSniffer/
          echo "Sketch folder contents:"
          ls -la HandshakeSniffer/

      - name: Compile for ESP32-S3 N16R8
        run: |
          FQBN="esp32:esp32:esp32s3:\
EraseFlash=none,\
PartitionScheme=huge_app,\
CPUFreq=240,\
PSRAM=opi,\
FlashMode=qio,\
FlashSize=16M,\
USBMode=hwcdc,\
CDCOnBoot=default,\
UploadSpeed=921600"
          
          echo "Compiling with FQBN: $FQBN"
          arduino-cli compile \
            --fqbn "$FQBN" \
            --output-dir build \
            --verbose \
            HandshakeSniffer

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HandshakeSniffer-v1.3-firmware
          path: build/
          retention-days: 30
